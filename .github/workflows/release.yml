name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type (stable | beta | alpha)'
        required: false
        default: 'stable'
        type: choice
        options:
          - stable
          - beta
          - alpha
      publish:
        description: 'Upload installers to API / cloud'
        required: false
        default: true
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            dist_script: dist:win
          - os: macos-latest
            platform: macos
            dist_script: dist:mac
          - os: ubuntu-latest
            platform: linux
            dist_script: dist:linux

    env:
      SERVER_API_BASE_URL: ${{ secrets.SERVER_API_BASE_URL }}
      RELEASE_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.release_type || 'stable' }}
      # Default off. macOS prepare step enables discovery after importing the cert.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Linux packaging deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fakeroot \
            dpkg \
            rpm \
            libarchive-tools \
            xz-utils

      - name: Prepare macOS code signing
        if: matrix.platform == 'macos'
        env:
          CSC_LINK_SECRET: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_SECRET: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          # Default: unsigned build (Gatekeeper may show downloaded DMG as damaged).
          {
            echo "MAC_SIGNING_ENABLED=false"
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false"
          } >> "$GITHUB_ENV"

          if [ -z "${CSC_LINK_SECRET:-}" ]; then
            echo "::warning::CSC_LINK is not set. Building an unsigned Mac DMG."
            exit 0
          fi

          CSC_KEY_PASSWORD_SECRET="$(printf '%s' "${CSC_KEY_PASSWORD_SECRET:-}")"
          if [ -z "${CSC_KEY_PASSWORD_SECRET}" ]; then
            echo "::error::CSC_LINK is set but CSC_KEY_PASSWORD is missing."
            exit 1
          fi

          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          if [[ "$CSC_LINK_SECRET" == http://* || "$CSC_LINK_SECRET" == https://* || "$CSC_LINK_SECRET" == /* ]]; then
            CERT_PATH="$CSC_LINK_SECRET"
          else
            export CERT_PATH
            python3 -c "import base64, os, pathlib; raw=os.environ['CSC_LINK_SECRET'].strip(); path=pathlib.Path(os.environ['CERT_PATH']); path.write_bytes(base64.b64decode(raw)); print(f'Decoded Developer ID certificate ({path.stat().st_size} bytes)')"
          fi

          if [ ! -f "$CERT_PATH" ]; then
            echo "::error::Developer ID certificate not found at $CERT_PATH"
            exit 1
          fi

          export OPENSSL_CERT_PASS="$CSC_KEY_PASSWORD_SECRET"
          if ! openssl pkcs12 -in "$CERT_PATH" -nokeys -passin env:OPENSSL_CERT_PASS >/dev/null 2>&1 \
            && ! openssl pkcs12 -in "$CERT_PATH" -nokeys -legacy -passin env:OPENSSL_CERT_PASS >/dev/null 2>&1; then
            echo "::error::CSC_KEY_PASSWORD does not unlock the .p12 in CSC_LINK. Re-export the cert and update both secrets."
            exit 1
          fi
          unset OPENSSL_CERT_PASS

          # Workaround for electron-builder bug #10066 (still present in 25.x):
          # CSC_LINK signing passes the .p12 password to `security set-key-partition-list -k`,
          # but -k needs the temporary keychain password → SecKeychainUnlock failure.
          # Import into our own keychain with the correct passwords, then tell
          # electron-builder to discover the identity (do NOT set CSC_LINK).
          KEYCHAIN_PATH="$RUNNER_TEMP/eda-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          security delete-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1 || true
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$CSC_KEY_PASSWORD_SECRET" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/productsign \
            -A

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          # Prefer our signing keychain without dropping the default login keychain.
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          echo "Code signing identities:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q "Developer ID Application"; then
            echo "::error::No 'Developer ID Application' identity found after importing the .p12. Export the Application (not Installer) certificate with its private key."
            exit 1
          fi

          {
            echo "MAC_SIGNING_ENABLED=true"
            echo "CSC_IDENTITY_AUTO_DISCOVERY=true"
            echo "CSC_KEYCHAIN=$KEYCHAIN_PATH"
            # Keep the keychain unlocked for the build job without printing the password.
            echo "KEYCHAIN_PASSWORD<<EOF"
            printf '%s\n' "$KEYCHAIN_PASSWORD"
            echo "EOF"
          } >> "$GITHUB_ENV"

          # Critical: do not export CSC_LINK / CSC_KEY_PASSWORD — that re-enters the buggy path.
          echo "macOS signing keychain ready (CSC_LINK bypass)"

      - name: Unlock macOS signing keychain
        if: matrix.platform == 'macos' && env.MAC_SIGNING_ENABLED == 'true'
        run: security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$CSC_KEYCHAIN"
        env:
          KEYCHAIN_PASSWORD: ${{ env.KEYCHAIN_PASSWORD }}
          CSC_KEYCHAIN: ${{ env.CSC_KEYCHAIN }}

      - name: Require API URL for packaged build
        shell: bash
        run: |
          if [ -z "$SERVER_API_BASE_URL" ]; then
            echo "::error::Missing repository secret SERVER_API_BASE_URL (e.g. https://api.example.com/api/v1)"
            exit 1
          fi
          if [[ ! "$SERVER_API_BASE_URL" =~ ^https:// ]]; then
            echo "::error::SERVER_API_BASE_URL must use HTTPS for packaged builds (got: $SERVER_API_BASE_URL)"
            exit 1
          fi

      - name: Build ${{ matrix.platform }} installer
        # --publish never: do not publish to GitHub Releases (we use our version API)
        # SERVER_API_BASE_URL is baked into the packaged app at build time
        # Do NOT pass CSC_LINK / CSC_KEY_PASSWORD — macOS signing uses the pre-imported keychain.
        run: npm run ${{ matrix.dist_script }} -- --publish never
        env:
          SERVER_API_BASE_URL: ${{ secrets.SERVER_API_BASE_URL }}
          APPLE_ID: ${{ matrix.platform == 'macos' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'macos' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'macos' && secrets.APPLE_TEAM_ID || '' }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eda-cleaner-${{ matrix.platform }}-${{ github.sha }}
          path: |
            release/*
            !release/**/*.blockmap
            !release/**/*.yml
            !release/**/*.yaml
          if-no-files-found: warn
          retention-days: 14

      - name: Decide whether to publish
        id: publish
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish }}" = "false" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to version API
        if: steps.publish.outputs.enabled == 'true'
        run: npm run publish:release:yes
        env:
          PUBLISH_RELEASE: '1'
          SERVER_API_BASE_URL: ${{ secrets.SERVER_API_BASE_URL }}
          RELEASE_TYPE: ${{ env.RELEASE_TYPE }}
