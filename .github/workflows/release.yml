name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type (stable | beta | alpha)'
        required: false
        default: 'stable'
        type: choice
        options:
          - stable
          - beta
          - alpha
      publish:
        description: 'Upload installers to API / cloud'
        required: false
        default: true
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            dist_script: dist:win
          - os: macos-latest
            platform: macos
            dist_script: dist:mac
          - os: ubuntu-latest
            platform: linux
            dist_script: dist:linux

    env:
      SERVER_API_BASE_URL: ${{ secrets.SERVER_API_BASE_URL }}
      RELEASE_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.release_type || 'stable' }}
      # Windows/Linux: do not auto-discover certs. macOS uses CSC_LINK when present.
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.platform == 'macos' && 'true' || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Linux packaging deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fakeroot \
            dpkg \
            rpm \
            libarchive-tools \
            xz-utils

      - name: Prepare macOS Developer ID certificate
        if: matrix.platform == 'macos'
        env:
          CSC_LINK_SECRET: ${{ secrets.CSC_LINK }}
        run: |
          if [ -z "$CSC_LINK_SECRET" ]; then
            echo "::warning::CSC_LINK is not set. The Mac DMG will be unsigned and macOS Gatekeeper will show it as damaged after a browser download. Add a Developer ID Application .p12 (base64) plus APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, and APPLE_TEAM_ID."
            exit 0
          fi
          if [[ "$CSC_LINK_SECRET" == http://* || "$CSC_LINK_SECRET" == https://* || "$CSC_LINK_SECRET" == /* ]]; then
            echo "CSC_LINK=$CSC_LINK_SECRET" >> "$GITHUB_ENV"
          else
            python3 -c "import base64, os, pathlib; raw=os.environ['CSC_LINK_SECRET'].strip(); path=pathlib.Path(os.environ['RUNNER_TEMP'])/'developer-id.p12'; path.write_bytes(base64.b64decode(raw)); print(f'Imported Developer ID certificate ({path.stat().st_size} bytes)')"
            echo "CSC_LINK=$RUNNER_TEMP/developer-id.p12" >> "$GITHUB_ENV"
          fi

      - name: Require API URL for packaged build
        shell: bash
        run: |
          if [ -z "$SERVER_API_BASE_URL" ]; then
            echo "::error::Missing repository secret SERVER_API_BASE_URL (e.g. https://api.example.com/api/v1)"
            exit 1
          fi
          if [[ ! "$SERVER_API_BASE_URL" =~ ^https:// ]]; then
            echo "::error::SERVER_API_BASE_URL must use HTTPS for packaged builds (got: $SERVER_API_BASE_URL)"
            exit 1
          fi

      - name: Build ${{ matrix.platform }} installer
        # --publish never: do not publish to GitHub Releases (we use our version API)
        # SERVER_API_BASE_URL is baked into the packaged app at build time
        run: npm run ${{ matrix.dist_script }} -- --publish never
        env:
          SERVER_API_BASE_URL: ${{ secrets.SERVER_API_BASE_URL }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'macos' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.platform == 'macos' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'macos' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'macos' && secrets.APPLE_TEAM_ID || '' }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eda-cleaner-${{ matrix.platform }}-${{ github.sha }}
          path: |
            release/*
            !release/**/*.blockmap
            !release/**/*.yml
            !release/**/*.yaml
          if-no-files-found: warn
          retention-days: 14

      - name: Decide whether to publish
        id: publish
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish }}" = "false" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to version API
        if: steps.publish.outputs.enabled == 'true'
        run: npm run publish:release:yes
        env:
          PUBLISH_RELEASE: '1'
          SERVER_API_BASE_URL: ${{ secrets.SERVER_API_BASE_URL }}
          RELEASE_TYPE: ${{ env.RELEASE_TYPE }}
